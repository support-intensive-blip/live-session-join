<!--
  Reference implementation only — NOT served by this repo's backend.

  Shows the exact sequence redirect-snippet.js implements, as a complete
  standalone page:
    1. A template to port into forms.ccbp.in/joinsession (or wherever this
       flow actually lives) — copy the logic, swap in that page's real
       profile-fetching code.
    2. Something you can open locally to sanity-check the join-service
       side (GET /api/join) by editing MOCK_PROFILE below.

  It only works for real students if hosted on the actual authenticated
  CCBP origin — opened from anywhere else, the profile fetch below will
  fail the same way described in INTEGRATION.md's CORS/auth analysis.

  WARNING: this page really does submit to whatever Google Form the
  join-service is configured with (GOOGLE_FORM_ACTION_URL). If you're just
  testing locally, point that env var at a local stub server first (run
  scripts/local-form-stub.mjs) — otherwise trying this page creates a real
  row in the production response sheet.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Join reference page</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p id="status">Joining…</p>
    <script type="module">
      const JOIN_SERVICE_BASE = "http://localhost:3000"; // point at your local join-service for testing

      // Replace with a real call to the CCBP profile endpoint when this
      // logic is actually running on the authenticated CCBP origin.
      const MOCK_PROFILE = { user_id: "test-uuid-1234", name: "Test Student" };
      async function getStudentProfile() {
        return MOCK_PROFILE;
      }

      const statusEl = document.getElementById("status");

      async function main() {
        const course = new URLSearchParams(window.location.search).get("course");
        if (!course) {
          statusEl.textContent = "Missing ?course= in the URL.";
          return;
        }

        const profile = await getStudentProfile();

        const params = new URLSearchParams({
          course,
          uid: profile.user_id,
          name: profile.name,
        });

        statusEl.textContent = "Redirecting to join-service…";
        window.location.href = `${JOIN_SERVICE_BASE}/api/join?${params.toString()}`;
      }

      main();
    </script>
  </body>
</html>
