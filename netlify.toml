[build]
  functions = "netlify/functions"
  # No real static site — this service is an API + admin dashboard, not a
  # student-facing page. Deliberately does NOT publish ccbp-integration/
  # (that folder's reference-join-page.html submits to the real
  # configured Google Form with no auth of its own; it must stay a local
  # dev tool, never a public URL).
  publish = "netlify-public"

[build.environment]
  # Match package.json's engines.node — the app uses features (built-in
  # fetch, node:test) that need Node 20+; Netlify's platform default has
  # been older than that at times.
  NODE_VERSION = "20"

[functions]
  # esbuild handles this project's ESM (`"type": "module"`) source and the
  # lazy `import("ioredis")` in src/lib/store.js correctly; Netlify's
  # older default bundler does not reliably handle ESM.
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
